<!DOCTYPE html>

<html>



<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">


<link rel="stylesheet" href="style.css">

<title>Product preview card component</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">


</head>


<body>

<div class="container">
        <div class="product-image">
          <picture>
            <source srcset="./images/image-product-desktop.jpg" media="(min-width:700px)">
            <img src="images/image-product-mobile.jpg">
          </picture>
        </div>

        <div class="product-information">
                <p class="product-name">PERFUME</p>
                <p class="title">Gabrielle Essence Eau De Parfum</p>
                <p class="description">
                    A floral solar and voluptuous interpertation
                    composed by Olivier Polge Perfumer-Creator
                    for the House of CHANEL
                </p>
                <div class="price">
                     <p class="new-price">$149.99</p>
                  <p class="old-price"><del>$169.99</del></p>

                </div>    
                
                <div class="add-to-cart">
                     <button class="add-to-cart-button"><img src="images/icon-cart.svg" class="icon-cart">Add To Cart </button>
                </div>

         </div>

  </div>






   







</body>










</html>
